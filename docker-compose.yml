#
# VdoGen — local stack (single file)
#
# Postgres + Redis + master/worker/status all in one compose project.
# GCP key path is baked in via GCP_KEY_FILE (defaults to the repo's service
# account) so nothing needs passing on the command line. minikube executes only
# render Jobs; worker/status reach it over a mounted kubeconfig.
#
#   make local/init   -> minikube + namespace + secrets + DB schema/seed
#   make local/up     -> docker compose up -d --build
#   make local/down   -> docker compose down
#
name: vdogen-local

x-be-env: &be-env
  NODE_ENV: development
  DATABASE_URL: postgresql://vdogen:vdogen@postgres:5432/vdogen
  PORT: 8081
  REDIS_URL: redis
  REDIS_PORT: 6379
  REDIS_USERNAME: ""
  REDIS_PASSWORD: ""
  K8S_NAMESPACE: vdogen
  GOOGLE_APPLICATION_CREDENTIALS: /gcp/key.json

services:
  # ---- State ---------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vdogen-postgres
    environment:
      POSTGRES_USER: vdogen
      POSTGRES_PASSWORD: vdogen
      POSTGRES_DB: vdogen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vdogen -d vdogen"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: vdogen-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  # ---- Backend servers -----------------------------------------------------
  master:
    container_name: vdogen-master
    build:
      context: ./BE
      dockerfile: Dockerfile.master
    command: >
      /bin/sh -c '
        if [ ! -f "$$GOOGLE_APPLICATION_CREDENTIALS" ]; then
          echo "ERROR: GCP service-account key not found at $$GOOGLE_APPLICATION_CREDENTIALS";
          echo "Place it at BE/vdogen-e3f9070cfa09.json (or set GCP_KEY_FILE) and restart.";
          exit 1;
        fi;
        exec bun run src/master/index.ts
      '

    environment:
      <<: *be-env
      AUTHORIZED_PARTY: http://localhost:5173
      CORS_ORIGIN: http://localhost:5173
      GOOGLE_AUTH_REDIRECT_URL: http://localhost:8081/v1/auth/google/callback
    env_file:
      - ./BE/.env
    volumes:
      - ${GCP_KEY_FILE:-./BE/vdogen-e3f9070cfa09.json}:/gcp/key.json:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  worker:
    container_name: vdogen-worker
    build:
      context: ./BE
      dockerfile: Dockerfile.worker
    command: >
      /bin/sh -c '
        if [ ! -f "$$GOOGLE_APPLICATION_CREDENTIALS" ]; then
          echo "ERROR: GCP service-account key not found at $$GOOGLE_APPLICATION_CREDENTIALS";
          echo "Place it at BE/vdogen-e3f9070cfa09.json (or set GCP_KEY_FILE) and restart.";
          exit 1;
        fi;
        exec bun run src/workers/video-generator-worker.ts
      '
    environment:
      <<: *be-env
      # dev/kubeconfig is regenerated by `make local/init` (sed swaps its inode),
      # so mount the DIRECTORY, not the file, or the container sees a stale inode.
      KUBECONFIG: /root/.kube/kubeconfig
      # Bun's fetch shim ignores the agent-level CA, so trust via the global store.
      NODE_EXTRA_CA_CERTS: /root/.kube/minikube-ca.crt
    env_file:
      - ./BE/.env
    volumes:
      - ${GCP_KEY_FILE:-./BE/vdogen-e3f9070cfa09.json}:/gcp/key.json:ro
      # The compose worker submits render Jobs to minikube with this kubeconfig.
      - ./dev:/root/.kube:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  status-check:
    container_name: vdogen-status-check
    build:
      context: ./BE
      dockerfile: Dockerfile.status
    command: >
      /bin/sh -c '
        if [ ! -f "$$GOOGLE_APPLICATION_CREDENTIALS" ]; then
          echo "ERROR: GCP service-account key not found at $$GOOGLE_APPLICATION_CREDENTIALS";
          echo "Place it at BE/vdogen-e3f9070cfa09.json (or set GCP_KEY_FILE) and restart.";
          exit 1;
        fi;
        exec bun run src/workers/status-check-worker.ts
      '
    environment:
      <<: *be-env
      KUBECONFIG: /root/.kube/kubeconfig
      # Bun's fetch shim ignores the agent-level CA, so trust via the global store.
      NODE_EXTRA_CA_CERTS: /root/.kube/minikube-ca.crt
    env_file:
      - ./BE/.env
    volumes:
      - ${GCP_KEY_FILE:-./BE/vdogen-e3f9070cfa09.json}:/gcp/key.json:ro
      - ./dev:/root/.kube:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  pgdata: